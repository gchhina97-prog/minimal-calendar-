<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Minimal Digital Calendar</title>
  <style>
    /* ── reset & base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #E8E6E1;
      --text-dark: #444444;
      --text-muted: #8C8C8C;
      --accent: #FF5500;
      --dot-bg: #FFFFFF;
      --border-light: #C8C6C1;
      --radius: 50%;
      --transition: 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      height: 100dvh;
      width: 100dvw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    .calendar-card {
      display: grid;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      padding: clamp(8px, 2vh, 24px);
      background: var(--bg);
      border-radius: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* ── Grid rows: distribute height proportionally ── */
    .calendar-card {
      grid-template-rows:
        minmax(0, 1.2fr)   /* big date */
        minmax(0, 0.9fr)   /* meta row */
        minmax(0, 0.8fr)   /* controls */
        minmax(0, 0.6fr)   /* day headers */
        3.5fr              /* dots grid — takes most space */
        minmax(0, 0.5fr);  /* footer */
      gap: clamp(2px, 0.6vh, 8px);
    }

    /* ── big date ── */
    .date-number {
      font-size: clamp(2.2rem, 10vh, 4.8rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -2px;
      color: var(--text-dark);
      align-self: end;
      margin-bottom: -0.2rem;
    }

    /* ── meta row ── */
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: clamp(2px, 0.4vh, 8px);
      border-bottom: 2px solid var(--border-light);
    }

    .month-year .month-name {
      font-size: clamp(1rem, 3.5vh, 2.2rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dark);
      line-height: 1.2;
    }
    .month-year .year-number {
      font-size: clamp(0.7rem, 2vh, 1.2rem);
      color: var(--text-muted);
    }
    .day-name {
      font-size: clamp(0.9rem, 3vh, 1.8rem);
      font-weight: 600;
      color: var(--text-dark);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── controls ── */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-btn {
      font-size: clamp(1.4rem, 4vh, 2.4rem);
      font-weight: 300;
      color: var(--text-dark);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 clamp(6px, 1vw, 16px);
      line-height: 1;
      border-radius: 40px;
      transition: background var(--transition), transform var(--transition);
    }
    .nav-btn:hover {
      background: rgba(0, 0, 0, 0.04);
      transform: scale(1.06);
    }
    .nav-btn:active {
      transform: scale(0.94);
    }
    .month-label {
      font-size: clamp(0.8rem, 2.5vh, 1.4rem);
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-dark);
      letter-spacing: 1.5px;
    }

    /* ── day headers ── */
    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }
    .day-headers span {
      font-size: clamp(0.5rem, 1.8vh, 1rem);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── dots grid ── */
    .dots-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(3px, 0.8vh, 10px);
      align-content: start;
      overflow: hidden;
      padding: 0;
    }

    .dot {
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: var(--radius);
      background-color: var(--dot-bg);
      color: #1A1A1A;
      font-size: clamp(0.7rem, 2.2vh, 1.4rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: transform var(--transition), background-color var(--transition), box-shadow var(--transition);
    }

    .dot.empty {
      background-color: transparent !important;
      box-shadow: none !important;
      transform: none !important;
      pointer-events: none;
      opacity: 0;
    }

    .dot.today {
      background-color: var(--accent) !important;
      color: #FFFFFF !important;
      transform: scale(1.1);
      box-shadow: 0 4px 16px rgba(255, 85, 0, 0.35);
      font-weight: 800;
    }

    /* ── footer ── */
    .footer-quote {
      text-align: center;
      font-size: clamp(0.4rem, 1.4vh, 0.8rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.7;
      align-self: center;
    }

    /* ── touch tweaks ── */
    @media (hover: none) {
      .nav-btn:hover {
        background: transparent;
        transform: none;
      }
      .nav-btn:active {
        transform: scale(0.92);
        background: rgba(0, 0, 0, 0.04);
      }
    }

    /* ════════════════════════════════════════════════════
       LANDSCAPE – fine‑tuned for 16:9 (Mi Max 2)
       ════════════════════════════════════════════════════ */
    @media (orientation: landscape) {
      .calendar-card {
        padding: clamp(4px, 1vh, 14px);
        gap: clamp(2px, 0.5vh, 6px);
        grid-template-rows:
          minmax(0, 1fr)
          minmax(0, 0.8fr)
          minmax(0, 0.7fr)
          minmax(0, 0.5fr)
          3.8fr
          minmax(0, 0.4fr);
      }

      .date-number {
        font-size: clamp(1.6rem, 7vh, 3.2rem);
        letter-spacing: -1px;
        align-self: center;
        margin-bottom: 0;
      }

      .month-year .month-name {
        font-size: clamp(0.8rem, 2.5vh, 1.4rem);
      }
      .month-year .year-number {
        font-size: clamp(0.5rem, 1.4vh, 0.9rem);
      }
      .day-name {
        font-size: clamp(0.7rem, 2.2vh, 1.2rem);
      }

      .controls {
        gap: 2px;
      }
      .nav-btn {
        font-size: clamp(1rem, 3vh, 1.8rem);
        padding: 0 clamp(4px, 0.8vw, 12px);
      }
      .month-label {
        font-size: clamp(0.6rem, 1.8vh, 1rem);
      }

      .day-headers span {
        font-size: clamp(0.4rem, 1.2vh, 0.7rem);
      }

      .dots-grid {
        gap: clamp(2px, 0.6vh, 8px);
      }

      .dot {
        font-size: clamp(0.6rem, 2vh, 1.1rem);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
      }

      .footer-quote {
        font-size: clamp(0.3rem, 1vh, 0.6rem);
        letter-spacing: 2px;
      }
    }

    /* extreme small landscape (height < 450px) */
    @media (orientation: landscape) and (max-height: 450px) {
      .date-number {
        font-size: clamp(1.2rem, 5vh, 2rem);
      }
      .dot {
        font-size: clamp(0.4rem, 1.4vh, 0.7rem);
      }
      .month-year .month-name {
        font-size: clamp(0.6rem, 1.8vh, 0.9rem);
      }
      .day-name {
        font-size: clamp(0.5rem, 1.6vh, 0.8rem);
      }
      .nav-btn {
        font-size: clamp(0.8rem, 2vh, 1.2rem);
      }
      .month-label {
        font-size: clamp(0.4rem, 1.2vh, 0.7rem);
      }
      .day-headers span {
        font-size: clamp(0.3rem, 0.9vh, 0.5rem);
      }
      .dots-grid {
        gap: 2px;
      }
      .footer-quote {
        font-size: clamp(0.25rem, 0.8vh, 0.4rem);
      }
    }
  </style>
</head>
<body>

  <div class="calendar-card" role="application" aria-label="Calendar">
    <div class="date-number" id="big-date">--</div>

    <div class="meta-row">
      <div class="month-year">
        <div class="month-name" id="month-name">MONTH</div>
        <div class="year-number" id="year-number">202X</div>
      </div>
      <div class="day-name" id="day-name">---</div>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prev-btn" aria-label="Previous month">‹</button>
      <span class="month-label" id="month-label">January 2025</span>
      <button class="nav-btn" id="next-btn" aria-label="Next month">›</button>
    </div>

    <div class="day-headers" aria-hidden="true">
      <span>M</span><span>T</span><span>W</span><span>T</span>
      <span>F</span><span>S</span><span>S</span>
    </div>

    <div class="dots-grid" id="dots-grid"></div>

    <div class="footer-quote">Less but better</div>
  </div>

  <script>
    (function() {
      'use strict';

      let viewYear = new Date().getFullYear();
      let viewMonth = new Date().getMonth();

      const bigDateEl = document.getElementById('big-date');
      const monthNameEl = document.getElementById('month-name');
      const yearNumberEl = document.getElementById('year-number');
      const dayNameEl = document.getElementById('day-name');
      const monthLabelEl = document.getElementById('month-label');
      const dotsGrid = document.getElementById('dots-grid');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');

      function getToday() {
        const d = new Date();
        return { year: d.getFullYear(), month: d.getMonth(), date: d.getDate() };
      }

      function daysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
      }

      function firstDayOffset(year, month) {
        const d = new Date(year, month, 1).getDay();
        return d === 0 ? 6 : d - 1;
      }

      function formatMonth(year, month) {
        const d = new Date(year, month, 1);
        return d.toLocaleString('default', { month: 'long' }) + ' ' + year;
      }

      function renderCalendar(year, month) {
        const today = getToday();
        const isCurrentMonth = (year === today.year && month === today.month);
        const todayDate = today.date;

        let displayDate = isCurrentMonth ? todayDate : 1;
        bigDateEl.textContent = displayDate;

        const currentDate = new Date(year, month, 1);
        monthNameEl.textContent = currentDate.toLocaleString('default', { month: 'long' });
        yearNumberEl.textContent = year;

        const dayName = new Date(year, month, displayDate)
          .toLocaleString('default', { weekday: 'short' });
        dayNameEl.textContent = dayName;

        monthLabelEl.textContent = formatMonth(year, month);

        dotsGrid.innerHTML = '';
        const offset = firstDayOffset(year, month);
        const totalDays = daysInMonth(year, month);

        for (let i = 0; i < offset; i++) {
          const empty = document.createElement('div');
          empty.className = 'dot empty';
          empty.setAttribute('aria-hidden', 'true');
          dotsGrid.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.textContent = day;
          if (isCurrentMonth && day === todayDate) {
            dot.classList.add('today');
          }
          dotsGrid.appendChild(dot);
        }
      }

      function goToMonth(year, month) {
        if (month < 0) { month = 11;
          year -= 1; }
        if (month > 11) { month = 0;
          year += 1; }
        viewYear = year;
        viewMonth = month;
        renderCalendar(viewYear, viewMonth);
      }

      function prevMonth() { goToMonth(viewYear, viewMonth - 1); }

      function nextMonth() { goToMonth(viewYear, viewMonth + 1); }

      function init() {
        const d = new Date();
        viewYear = d.getFullYear();
        viewMonth = d.getMonth();
        renderCalendar(viewYear, viewMonth);
      }

      prevBtn.addEventListener('click', prevMonth);
      nextBtn.addEventListener('click', nextMonth);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { e.preventDefault();
          prevMonth(); }
        if (e.key === 'ArrowRight') { e.preventDefault();
          nextMonth(); }
      });

      setInterval(() => {
        renderCalendar(viewYear, viewMonth);
      }, 60000);

      init();
    })();
  </script>

</body>
</html>
