<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Minimal Week Calendar</title>
  <style>
    /* ── reset & base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #E8E6E1;
      --text-dark: #2C2C2C;
      --text-muted: #8C8C8C;
      --accent: #FF5500;
      --dot-bg: #FFFFFF;
      --border-light: #D0CEC9;
      --radius: 50%;
      --transition: 0.2s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      height: 100dvh;
      width: 100dvw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    .calendar-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      padding: clamp(10px, 2.5vh, 28px);
      background: var(--bg);
      box-sizing: border-box;
      overflow: hidden;
      justify-content: space-between;
    }

    /* ── top bar ── */
    .top-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: clamp(4px, 0.8vh, 12px);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .view-toggle {
      display: flex;
      gap: clamp(12px, 2vw, 28px);
      font-size: clamp(0.9rem, 2.5vh, 1.6rem);
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .view-toggle .active {
      color: var(--text-dark);
      position: relative;
    }
    .view-toggle .active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
    }

    /* ── big date ── */
    .big-date {
      display: flex;
      align-items: baseline;
      gap: clamp(6px, 1vw, 16px);
      flex-shrink: 0;
      padding: clamp(4px, 1vh, 12px) 0;
    }
    .big-date .month {
      font-size: clamp(1.8rem, 5vh, 3.6rem);
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .big-date .day {
      font-size: clamp(2.8rem, 8vh, 5.2rem);
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1;
    }

    /* ── week navigation ── */
    .week-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      padding: clamp(2px, 0.5vh, 8px) 0;
    }
    .week-nav .nav-btn {
      font-size: clamp(1.6rem, 4vh, 2.6rem);
      font-weight: 300;
      color: var(--text-dark);
      background: none;
      border: none;
      padding: 0 clamp(12px, 2vw, 24px);
      cursor: pointer;
      line-height: 1;
      transition: transform var(--transition);
      border-radius: 40px;
    }
    .week-nav .nav-btn:hover {
      transform: scale(1.1);
    }
    .week-nav .nav-btn:active {
      transform: scale(0.9);
    }
    .week-label {
      font-size: clamp(0.9rem, 2.2vh, 1.4rem);
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* ── week grid ── */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(4px, 0.8vh, 12px);
      flex: 1 1 auto;
      min-height: 0;
      padding: clamp(4px, 0.6vh, 10px) 0;
      align-content: center;
    }

    .day-header {
      text-align: center;
      font-size: clamp(0.6rem, 1.6vh, 1rem);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-bottom: clamp(2px, 0.4vh, 6px);
    }

    .day-cell {
      aspect-ratio: 1 / 1;
      width: 100%;
      border-radius: var(--radius);
      background-color: var(--dot-bg);
      color: #1A1A1A;
      font-size: clamp(0.9rem, 2.6vh, 1.6rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: transform var(--transition), background-color var(--transition), box-shadow var(--transition);
      user-select: none;
    }
    .day-cell.today {
      background-color: var(--accent) !important;
      color: #FFFFFF !important;
      transform: scale(1.08);
      box-shadow: 0 4px 16px rgba(255, 85, 0, 0.35);
      font-weight: 800;
    }
    .day-cell.other-month {
      color: var(--text-muted);
      background-color: #F0EEE9;
    }

    /* ── actions ── */
    .actions {
      display: flex;
      justify-content: space-between;
      gap: clamp(10px, 2vw, 24px);
      flex-shrink: 0;
      padding-top: clamp(6px, 1.2vh, 16px);
      border-top: 1px solid var(--border-light);
      margin-top: auto;
    }
    .actions button {
      flex: 1;
      padding: clamp(6px, 1.2vh, 14px) clamp(8px, 1.5vw, 20px);
      border: none;
      border-radius: 40px;
      font-size: clamp(0.7rem, 1.8vh, 1.1rem);
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      letter-spacing: 0.3px;
    }
    .actions .add-reminder {
      background: #FFFFFF;
      color: var(--text-dark);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .actions .add-reminder:hover {
      background: #F5F3EF;
    }
    .actions .new-event {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(255, 85, 0, 0.3);
    }
    .actions .new-event:hover {
      background: #E64A00;
    }
    .actions button:active {
      transform: scale(0.96);
    }

    /* ── touch tweaks ── */
    @media (hover: none) {
      .nav-btn:hover,
      .actions button:hover {
        transform: none;
      }
      .nav-btn:active {
        transform: scale(0.9);
      }
      .actions button:active {
        transform: scale(0.96);
      }
    }

    /* ════════════════════════════════════════════════════
       LANDSCAPE – fine‑tuned for 16:9 (Mi Max 2)
       ════════════════════════════════════════════════════ */
    @media (orientation: landscape) {
      .calendar-card {
        padding: clamp(4px, 1vh, 12px);
        gap: 0;
      }
      .big-date .month {
        font-size: clamp(1.2rem, 2.8vh, 1.8rem);
      }
      .big-date .day {
        font-size: clamp(1.8rem, 4.5vh, 2.8rem);
      }
      .week-grid {
        gap: clamp(2px, 0.5vh, 6px);
      }
      .day-header {
        font-size: clamp(0.4rem, 1.2vh, 0.7rem);
        padding-bottom: clamp(1px, 0.2vh, 4px);
      }
      .day-cell {
        font-size: clamp(0.6rem, 1.8vh, 1rem);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
      }
      .week-label {
        font-size: clamp(0.6rem, 1.6vh, 1rem);
      }
      .week-nav .nav-btn {
        font-size: clamp(1rem, 2.5vh, 1.6rem);
      }
      .actions button {
        font-size: clamp(0.5rem, 1.4vh, 0.85rem);
        padding: clamp(4px, 0.8vh, 10px) clamp(6px, 1vw, 14px);
      }
      .top-bar .view-toggle {
        font-size: clamp(0.6rem, 1.6vh, 1rem);
        gap: clamp(6px, 1vw, 16px);
      }
      .actions {
        padding-top: clamp(4px, 0.6vh, 10px);
      }
    }

    /* extreme small landscape (height < 450px) */
    @media (orientation: landscape) and (max-height: 450px) {
      .calendar-card {
        padding: 2px 8px;
      }
      .big-date .month {
        font-size: 0.9rem;
      }
      .big-date .day {
        font-size: 1.4rem;
      }
      .day-cell {
        font-size: 0.5rem;
      }
      .day-header {
        font-size: 0.35rem;
      }
      .week-label {
        font-size: 0.5rem;
      }
      .week-nav .nav-btn {
        font-size: 0.8rem;
      }
      .actions button {
        font-size: 0.4rem;
        padding: 2px 6px;
      }
      .top-bar .view-toggle {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="calendar-card" role="application" aria-label="Week Calendar">

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="view-toggle">
        <span class="active">Weekly</span>
        <span>Monthly</span>
      </div>
    </div>

    <!-- Big Date -->
    <div class="big-date">
      <span class="month" id="month-label">April</span>
      <span class="day" id="day-label">21</span>
    </div>

    <!-- Week Navigation -->
    <div class="week-nav">
      <button class="nav-btn" id="prev-week">‹</button>
      <span class="week-label" id="week-label">Week 17</span>
      <button class="nav-btn" id="next-week">›</button>
    </div>

    <!-- Week Grid (7 columns) -->
    <div class="week-grid" id="week-grid">
      <!-- headers and cells will be generated by JS -->
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="add-reminder">Add Reminder</button>
      <button class="new-event">+ New Event</button>
    </div>

  </div>

  <script>
    (function() {
      'use strict';

      // ── state ──
      let currentDate = new Date(); // the day we focus (today initially)
      // We'll keep the week starting on Sunday

      // ── DOM refs ──
      const monthLabel = document.getElementById('month-label');
      const dayLabel = document.getElementById('day-label');
      const weekLabel = document.getElementById('week-label');
      const weekGrid = document.getElementById('week-grid');
      const prevBtn = document.getElementById('prev-week');
      const nextBtn = document.getElementById('next-week');

      // ── helpers ──
      function getStartOfWeek(date) {
        const d = new Date(date);
        const day = d.getDay(); // 0 = Sunday
        d.setDate(d.getDate() - day);
        return d;
      }

      function getWeekNumber(date) {
        // ISO week number
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        // Thursday in current week decides the year
        d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
        const week1 = new Date(d.getFullYear(), 0, 4);
        return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
      }

      function formatDate(date) {
        const month = date.toLocaleString('default', { month: 'long' });
        const day = date.getDate();
        return { month, day };
      }

      function isSameDay(d1, d2) {
        return d1.getFullYear() === d2.getFullYear() &&
          d1.getMonth() === d2.getMonth() &&
          d1.getDate() === d2.getDate();
      }

      function isSameMonth(d1, d2) {
        return d1.getFullYear() === d2.getFullYear() &&
          d1.getMonth() === d2.getMonth();
      }

      // ── render week ──
      function renderWeek(focusDate) {
        // focusDate is the day we want to show (e.g., today)
        const start = getStartOfWeek(focusDate);
        const today = new Date();

        // Update big date
        const { month, day } = formatDate(focusDate);
        monthLabel.textContent = month;
        dayLabel.textContent = day;

        // Update week number
        const weekNum = getWeekNumber(focusDate);
        weekLabel.textContent = 'Week ' + weekNum;

        // Build grid
        weekGrid.innerHTML = '';

        // Day initials (Sun–Sat)
        const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        for (let i = 0; i < 7; i++) {
          const header = document.createElement('div');
          header.className = 'day-header';
          header.textContent = dayNames[i];
          weekGrid.appendChild(header);
        }

        // Dates
        const currentMonth = start.getMonth();
        const currentYear = start.getFullYear();
        for (let i = 0; i < 7; i++) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);

          const cell = document.createElement('div');
          cell.className = 'day-cell';
          cell.textContent = date.getDate();

          // Highlight today
          if (isSameDay(date, today)) {
            cell.classList.add('today');
          }

          // Gray out dates not in the same month as focusDate
          if (!isSameMonth(date, focusDate)) {
            cell.classList.add('other-month');
          }

          // Click to focus on that day (update big date and week)
          cell.addEventListener('click', function() {
            currentDate = new Date(date);
            renderWeek(currentDate);
          });

          weekGrid.appendChild(cell);
        }
      }

      // ── navigation ──
      function goToWeek(offset) {
        const newDate = new Date(currentDate);
        newDate.setDate(newDate.getDate() + offset * 7);
        currentDate = newDate;
        renderWeek(currentDate);
      }

      function prevWeek() { goToWeek(-1); }
      function nextWeek() { goToWeek(1); }

      // ── init ──
      function init() {
        currentDate = new Date(); // today
        renderWeek(currentDate);
      }

      // ── events ──
      prevBtn.addEventListener('click', prevWeek);
      nextBtn.addEventListener('click', nextWeek);

      // Keyboard support
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { e.preventDefault();
          prevWeek(); }
        if (e.key === 'ArrowRight') { e.preventDefault();
          nextWeek(); }
      });

      // Auto-refresh to update today's highlight every minute
      setInterval(() => {
        // Re-render with same focusDate to update today highlight
        renderWeek(currentDate);
      }, 60000);

      init();
    })();
  </script>

</body>
</html>
