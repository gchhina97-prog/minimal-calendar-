<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minimal Digital Calendar</title>
  <style>
    :root {
      --bg-color: #121212;
      --text-main: #888888; /* Gray Big Date & Main Text */
      --text-muted: #666666;
      --accent-orange: #FF5500; /* Today's Orange Highlight */
      --dot-empty: #2B2B2B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .calendar-card {
      width: 95vw;
      max-width: 680px;
      padding: 36px;
      display: flex;
      flex-direction: column;
    }

    /* Oversized Gray Main Date Display */
    .date-number {
      font-size: clamp(10rem, 25vw, 16rem);
      font-weight: 800;
      line-height: 0.8;
      letter-spacing: -6px;
      color: var(--text-main);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 32px;
      padding-bottom: 12px;
      border-bottom: 2px solid #222222;
    }

    .month-year {
      text-transform: uppercase;
    }

    .month-name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
    }

    .year-number {
      font-size: 1.6rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .day-name {
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .controls {
      display: flex;
      gap: 20px;
      margin: 24px 0 32px 0;
    }

    .nav-btn {
      font-size: 1.6rem;
      color: var(--text-main);
      user-select: none;
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      margin-bottom: 18px;
    }

    .day-headers span {
      font-size: 1.2rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .dots-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 16px;
      justify-items: center;
    }

    /* Day Dots with Visible Centered Date Numbers */
    .dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #FFFFFF;
      color: #121212; /* Black Date Number Text inside dot */
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    /* Today's Orange Highlight with White Text */
    .dot.today {
      background-color: var(--accent-orange) !important;
      color: #FFFFFF !important;
      transform: scale(1.18);
      box-shadow: 0 0 16px rgba(255, 85, 0, 0.7);
    }

    .dot.empty {
      background-color: transparent !important;
      border: 2px dashed var(--dot-empty);
    }

    .footer-quote {
      text-align: center;
      margin-top: 48px;
      font-size: 0.95rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="calendar-card">
    <div class="date-number" id="big-date">--</div>
    
    <div class="meta-row">
      <div class="month-year">
        <div class="month-name" id="month-name">MONTH</div>
        <div class="year-number" id="year-number">202X</div>
      </div>
      <div class="day-name" id="day-name">---</div>
    </div>

    <div class="controls">
      <span class="nav-btn">&lt;</span>
      <span class="nav-btn">&gt;</span>
    </div>

    <div class="day-headers">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>

    <div class="dots-grid" id="dots-grid"></div>

    <div class="footer-quote">Less but better</div>
  </div>

  <script>
    // Distinct shade colors for each date dot across the month
    const distinctColors = [
      "#FFFFFF", "#F2F2F2", "#E6E6E6", "#DADADA", "#CECECE",
      "#C2C2C2", "#B6B6B6", "#AAAAAA", "#F8F8F8", "#ECECEC",
      "#E0E0E0", "#D4D4D4", "#C8C8C8", "#BCBCBC", "#B0B0B0",
      "#F4F4F4", "#E8E8E8", "#DCDCDC", "#D0D0D0", "#C4C4C4",
      "#B8B8B8", "#ACACAC", "#F0F0F0", "#E4E4E4", "#D8D8D8",
      "#CCCCCC", "#C0C0C0", "#B4B4B4", "#A8A8A8", "#FAFAFA", "#EEEEEE"
    ];

    function renderCalendar() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();

      // Set main date display values
      document.getElementById('big-date').textContent = today.getDate();
      document.getElementById('month-name').textContent = today.toLocaleString('default', { month: 'long' });
      document.getElementById('year-number').textContent = year;
      document.getElementById('day-name').textContent = today.toLocaleString('default', { weekday: 'short' });

      const grid = document.getElementById('dots-grid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const startOffset = (firstDay === 0 ? 6 : firstDay - 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      // Render offset dots before start of month
      for (let i = 0; i < startOffset; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot empty';
        grid.appendChild(dot);
      }

      // Render dots with date numbers inside
      for (let day = 1; day <= daysInMonth; day++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.textContent = day; // Insert visible date number inside dot
        
        // Apply distinct shade color
        dot.style.backgroundColor = distinctColors[(day - 1) % distinctColors.length];

        // Today is highlighted in Orange
        if (day === today.getDate()) {
          dot.classList.add('today');
        }

        grid.appendChild(dot);
      }
    }

    renderCalendar();
    setInterval(renderCalendar, 3600000); // Automatically refresh date every hour
  </script>
</body>
</html>
