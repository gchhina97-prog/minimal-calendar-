<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Digital Calendar</title>
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #E8E6E1;
            --text-dark: #444444;
            --text-muted: #8C8C8C;
            --accent: #FF5500;
            --dot-bg: #FFFFFF;
            --border-light: #C8C6C1;
            --radius: 50%;
            --transition: 0.2s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        /* ── card ── */
        .calendar-card {
            width: 100%;
            max-width: 700px;
            padding: clamp(20px, 5vw, 44px);
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border-radius: 32px;
        }

        /* ── big date ── */
        .date-number {
            font-size: clamp(4.8rem, 22vw, 14rem);
            font-weight: 800;
            line-height: 0.82;
            letter-spacing: -4px;
            color: var(--text-dark);
            transition: font-size 0.2s;
        }

        /* ── meta row ── */
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: clamp(20px, 4vw, 36px);
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-light);
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .month-year .month-name {
            font-size: clamp(1.6rem, 4.5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dark);
            line-height: 1.2;
        }
        .month-year .year-number {
            font-size: clamp(1rem, 2.2vw, 1.6rem);
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        .day-name {
            font-size: clamp(1.4rem, 3.8vw, 2.4rem);
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* ── controls ── */
        .controls {
            display: flex;
            gap: clamp(16px, 3vw, 32px);
            margin: clamp(16px, 2.5vw, 28px) 0 clamp(20px, 3vw, 34px) 0;
            align-items: center;
        }
        .nav-btn {
            font-size: clamp(1.6rem, 3.2vw, 2.4rem);
            font-weight: 300;
            color: var(--text-dark);
            cursor: pointer;
            user-select: none;
            padding: 4px 12px;
            border-radius: 40px;
            transition: background var(--transition), transform var(--transition);
            line-height: 1;
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.04);
            transform: scale(1.06);
        }
        .nav-btn:active {
            transform: scale(0.94);
        }

        .month-label {
            font-size: clamp(1.1rem, 2.2vw, 1.6rem);
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            flex: 1;
            min-width: 80px;
        }

        /* ── day headers ── */
        .day-headers {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: clamp(10px, 1.8vw, 20px);
            gap: clamp(4px, 1vw, 14px);
        }
        .day-headers span {
            font-size: clamp(0.75rem, 1.6vw, 1.2rem);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ── dots grid ── */
        .dots-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: clamp(4px, 1.2vw, 16px);
        }

        /* ── dot ── */
        .dot {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: var(--radius);
            background-color: var(--dot-bg);
            color: #1A1A1A;
            font-size: clamp(0.7rem, 1.6vw, 1.2rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: transform var(--transition), background-color var(--transition), box-shadow var(--transition);
            will-change: transform;
            /* ensure text fits */
            line-height: 1;
            text-align: center;
        }

        /* empty dot – completely invisible, keeps grid alignment */
        .dot.empty {
            background-color: transparent !important;
            box-shadow: none !important;
            transform: none !important;
            pointer-events: none;
        }

        /* today's dot – orange highlight */
        .dot.today {
            background-color: var(--accent) !important;
            color: #FFFFFF !important;
            transform: scale(1.12);
            box-shadow: 0 4px 16px rgba(255, 85, 0, 0.35);
            font-weight: 800;
        }

        /* ── footer ── */
        .footer-quote {
            text-align: center;
            margin-top: clamp(28px, 5vw, 52px);
            font-size: clamp(0.7rem, 1.4vw, 0.95rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* ── small-screen adjustments ── */
        @media (max-width: 420px) {
            .calendar-card {
                padding: 16px 12px;
            }
            .meta-row {
                padding-bottom: 8px;
            }
            .controls {
                gap: 10px;
                margin: 12px 0 16px 0;
            }
            .day-headers {
                gap: 3px;
                margin-bottom: 8px;
            }
            .dots-grid {
                gap: 4px;
            }
            .dot {
                font-size: clamp(0.6rem, 3.2vw, 0.85rem);
            }
            .date-number {
                letter-spacing: -2px;
            }
        }

        /* touch-friendly tap target */
        @media (hover: none) {
            .nav-btn:hover {
                background: transparent;
                transform: none;
            }
            .nav-btn:active {
                transform: scale(0.92);
                background: rgba(0, 0, 0, 0.04);
            }
        }
    </style>
</head>
<body>

    <div class="calendar-card" role="application" aria-label="Calendar">

        <!-- Big Date -->
        <div class="date-number" id="big-date">--</div>

        <!-- Meta Row -->
        <div class="meta-row">
            <div class="month-year">
                <div class="month-name" id="month-name">MONTH</div>
                <div class="year-number" id="year-number">202X</div>
            </div>
            <div class="day-name" id="day-name">---</div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="nav-btn" id="prev-btn" aria-label="Previous month">‹</button>
            <span class="month-label" id="month-label">January 2025</span>
            <button class="nav-btn" id="next-btn" aria-label="Next month">›</button>
        </div>

        <!-- Day Headers (Mon–Sun) -->
        <div class="day-headers" aria-hidden="true">
            <span>M</span><span>T</span><span>W</span><span>T</span>
            <span>F</span><span>S</span><span>S</span>
        </div>

        <!-- Dots Grid -->
        <div class="dots-grid" id="dots-grid"></div>

        <!-- Footer -->
        <div class="footer-quote">Less but better</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── state ──────────────────────────────────────────────
            let viewYear = new Date().getFullYear();
            let viewMonth = new Date().getMonth(); // 0-based

            // ─── DOM refs ──────────────────────────────────────────
            const bigDateEl = document.getElementById('big-date');
            const monthNameEl = document.getElementById('month-name');
            const yearNumberEl = document.getElementById('year-number');
            const dayNameEl = document.getElementById('day-name');
            const monthLabelEl = document.getElementById('month-label');
            const dotsGrid = document.getElementById('dots-grid');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            // ─── helpers ───────────────────────────────────────────
            function getToday() {
                const d = new Date();
                return { year: d.getFullYear(), month: d.getMonth(), date: d.getDate() };
            }

            function daysInMonth(year, month) {
                return new Date(year, month + 1, 0).getDate();
            }

            function firstDayOffset(year, month) {
                // getDay(): 0=Sun → we want Mon=0 … Sun=6
                const d = new Date(year, month, 1).getDay();
                return d === 0 ? 6 : d - 1;
            }

            function formatMonth(year, month) {
                const d = new Date(year, month, 1);
                return d.toLocaleString('default', { month: 'long' }) + ' ' + year;
            }

            // ─── render ────────────────────────────────────────────
            function renderCalendar(year, month) {
                const today = getToday();
                const isCurrentMonth = (year === today.year && month === today.month);
                const todayDate = today.date;

                // Big date
                const currentDate = new Date(year, month, 1);
                // show today's date if we're viewing current month, else show 1st
                let displayDate;
                if (isCurrentMonth) {
                    displayDate = todayDate;
                } else {
                    // show the last day of the viewed month, or 1st? let's show 1st
                    displayDate = 1;
                }
                bigDateEl.textContent = displayDate;

                // Month name & year
                const monthName = currentDate.toLocaleString('default', { month: 'long' });
                monthNameEl.textContent = monthName;
                yearNumberEl.textContent = year;

                // Day name (for the displayed date)
                const dayName = new Date(year, month, displayDate)
                    .toLocaleString('default', { weekday: 'short' });
                dayNameEl.textContent = dayName;

                // Label for controls
                monthLabelEl.textContent = formatMonth(year, month);

                // ── build dots grid ──
                dotsGrid.innerHTML = '';

                const offset = firstDayOffset(year, month);
                const totalDays = daysInMonth(year, month);

                // empty slots before 1st
                for (let i = 0; i < offset; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'dot empty';
                    empty.setAttribute('aria-hidden', 'true');
                    dotsGrid.appendChild(empty);
                }

                // day dots
                for (let day = 1; day <= totalDays; day++) {
                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    dot.textContent = day;

                    // highlight today
                    if (isCurrentMonth && day === todayDate) {
                        dot.classList.add('today');
                    }

                    dotsGrid.appendChild(dot);
                }
            }

            // ─── navigation ────────────────────────────────────────
            function goToMonth(year, month) {
                // clamp month
                if (month < 0) { month = 11;
                    year -= 1; }
                if (month > 11) { month = 0;
                    year += 1; }
                viewYear = year;
                viewMonth = month;
                renderCalendar(viewYear, viewMonth);
            }

            function prevMonth() { goToMonth(viewYear, viewMonth - 1); }

            function nextMonth() { goToMonth(viewYear, viewMonth + 1); }

            // ─── init ──────────────────────────────────────────────
            function init() {
                const d = new Date();
                viewYear = d.getFullYear();
                viewMonth = d.getMonth();
                renderCalendar(viewYear, viewMonth);
            }

            // ─── events ────────────────────────────────────────────
            prevBtn.addEventListener('click', prevMonth);
            nextBtn.addEventListener('click', nextMonth);

            // keyboard support
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') { e.preventDefault();
                    prevMonth(); }
                if (e.key === 'ArrowRight') { e.preventDefault();
                    nextMonth(); }
            });

            // refresh every hour (keeps today highlighted)
            setInterval(() => {
                // re-render current view – but if view is current month, today highlight updates
                renderCalendar(viewYear, viewMonth);
            }, 3600000);

            // ─── go ────────────────────────────────────────────────
            init();

        })();
    </script>

</body>
</html>
