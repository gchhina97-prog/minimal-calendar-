<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #E8E6E1;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      height: 100dvh;
      width: 100dvw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100dvh;
      padding: clamp(12px, 3vh, 40px);
      background: #E8E6E1;
    }

    /* ── top row: "Wed Sep" ── */
    .top-row {
      font-size: clamp(1.6rem, 5vh, 4rem);
      font-weight: 600;
      color: #444444;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: clamp(-4px, -0.5vh, 0px);
    }

    /* ── big date ── */
    .big-date {
      font-size: clamp(10rem, 35vh, 28rem);
      font-weight: 800;
      line-height: 1;
      color: #444444;
      letter-spacing: -6px;
      margin: clamp(-8px, -1vh, 0px) 0;
    }

    /* ── "Calendar" label ── */
    .bottom-label {
      font-size: clamp(0.9rem, 2.2vh, 1.8rem);
      font-weight: 500;
      color: #8C8C8C;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: clamp(4px, 1vh, 16px);
    }

    /* ── subtle today dot indicator ── */
    .today-dot {
      width: clamp(6px, 1.2vh, 12px);
      height: clamp(6px, 1.2vh, 12px);
      border-radius: 50%;
      background: #FF5500;
      margin-top: clamp(6px, 1.2vh, 14px);
      box-shadow: 0 2px 8px rgba(255, 85, 0, 0.3);
    }

    /* ── landscape tweaks ── */
    @media (orientation: landscape) {
      .calendar-card {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: clamp(4px, 1vw, 20px);
        padding: clamp(6px, 1.5vh, 20px);
      }

      .top-row {
        font-size: clamp(1.2rem, 4vh, 2.8rem);
        margin-bottom: 0;
        width: 100%;
        text-align: center;
      }

      .big-date {
        font-size: clamp(6rem, 22vh, 16rem);
        letter-spacing: -4px;
        margin: 0;
        line-height: 1;
        width: 100%;
        text-align: center;
      }

      .bottom-label {
        font-size: clamp(0.6rem, 1.8vh, 1.2rem);
        letter-spacing: 4px;
        margin-top: 0;
        width: 100%;
        text-align: center;
      }

      .today-dot {
        width: clamp(4px, 0.8vh, 8px);
        height: clamp(4px, 0.8vh, 8px);
        margin-top: 0;
      }

      /* make it a nice horizontal layout */
      .calendar-card {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto auto;
        align-items: center;
        justify-items: center;
      }

      .top-row {
        grid-row: 1;
      }
      .big-date {
        grid-row: 2;
        align-self: center;
      }
      .bottom-label {
        grid-row: 3;
      }
      .today-dot {
        grid-row: 4;
      }
    }

    /* extra small landscape */
    @media (orientation: landscape) and (max-height: 450px) {
      .top-row {
        font-size: clamp(0.8rem, 2.5vh, 1.4rem);
      }
      .big-date {
        font-size: clamp(3.6rem, 14vh, 8rem);
        letter-spacing: -2px;
      }
      .bottom-label {
        font-size: clamp(0.4rem, 1.2vh, 0.7rem);
        letter-spacing: 2px;
      }
      .today-dot {
        width: clamp(3px, 0.6vh, 5px);
        height: clamp(3px, 0.6vh, 5px);
      }
    }

    /* portrait fine-tune */
    @media (orientation: portrait) {
      .calendar-card {
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="calendar-card" id="app">
    <div class="top-row" id="top-row">Wed Sep</div>
    <div class="big-date" id="big-date">9</div>
    <div class="bottom-label">Calendar</div>
    <div class="today-dot"></div>
  </div>

  <script>
    (function() {
      const topRow = document.getElementById('top-row');
      const bigDate = document.getElementById('big-date');

      function update() {
        const now = new Date();
        const day = now.toLocaleString('default', { weekday: 'short' }); // "Wed"
        const month = now.toLocaleString('default', { month: 'short' }); // "Sep"
        const date = now.getDate();

        topRow.textContent = day + ' ' + month;
        bigDate.textContent = date;
      }

      update();
      // update every minute (in case day changes)
      setInterval(update, 60000);
    })();
  </script>

</body>
</html>
